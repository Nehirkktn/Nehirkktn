<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Nehir Kökten</title>
  <desc id="d">Terminal window. whoami: Nehir Kökten, Software Engineering student, year 2, Fırat University. focus: games, security tooling, web platforms. status: founder at DuckingCore, Microsoft Student Ambassador.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
    .p   { fill: #CC1F1F; font-size: 16px; font-weight: 700; }
    .c   { fill: #E8E8E8; font-size: 16px; }
    .o   { fill: #A8A8A8; font-size: 15px; }
    .hl  { fill: #FF5A5A; }
    .ln  { opacity: 0; animation: in .35s ease-out forwards; }
    .l1 { animation-delay: .2s; }  .l2 { animation-delay: .7s; }
    .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.7s; }
    .l5 { animation-delay: 2.2s; } .l6 { animation-delay: 2.7s; }
    .cur { animation: blink 1.1s steps(1) infinite; animation-delay: 3s; opacity: 0; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ln { animation: none; opacity: 1; } .cur { animation: none; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CC1F1F"/><stop offset=".6" stop-color="#3D0000"/><stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="298" rx="12" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="36" rx="12" fill="#161616"/>
  <rect x="1" y="25" width="898" height="12" fill="#161616"/>
  <rect x="1" y="37" width="898" height="2" fill="url(#edge)"/>
  <circle cx="24" cy="19" r="6" fill="#CC1F1F"/><circle cx="44" cy="19" r="6" fill="#5A1A1A"/><circle cx="64" cy="19" r="6" fill="#3A3A3A"/>
  <text x="450" y="24" text-anchor="middle" class="mono" fill="#8A8A8A" font-size="13">nehir@duckingcore: ~</text>

  <g class="mono">
    <text x="28" y="80"  class="ln l1"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
    <text x="28" y="106" class="ln l2 o"><tspan class="c" font-weight="700">Nehir Kökten</tspan> · Software Engineering, Year 2 · Fırat University</text>
    <text x="28" y="146" class="ln l3"><tspan class="p">$ </tspan><tspan class="c">cat focus.txt</tspan></text>
    <text x="28" y="172" class="ln l4 o">games  ·  security tooling  ·  web platforms  ·  teams that ship</text>
    <text x="28" y="212" class="ln l5"><tspan class="p">$ </tspan><tspan class="c">status --now</tspan></text>
    <text x="28" y="238" class="ln l6 o">founder <tspan class="hl">@DuckingCore</tspan>  ·  <tspan class="hl">Microsoft Student Ambassador</tspan></text>
    <text x="28" y="272"><tspan class="p">$ </tspan></text>
    <rect x="46" y="259" width="10" height="17" fill="#CC1F1F" class="cur"/>
  </g>
</svg>
