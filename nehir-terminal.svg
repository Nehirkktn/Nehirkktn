$ man nehir
  Önce planlar. 5 kişilik bir ekibi yöneterek 6 haftalık dönem projesini zamanında teslim etti.
  Bilmediği bir şeyle karşılaşınca beklemez. Öğrenir, dener, yayına alır.
  Baskı altında sakin kalır ve başladığı işi bitirir.
  Cesur kararlardan korkmaz, hesapsız olanlardan korkar.

